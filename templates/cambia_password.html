{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-head">
    <div class="auth-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2.5 2.5M14 9l2 2"/></svg></div>
    <h1 class="auth-title">Cambia Password</h1>
    <p class="auth-lead">Imposta una nuova password per il tuo account.</p>
  </div>
  <div class="fsa-card auth-card">
    {% if errore %}
      <div class="alert alert-danger"><div>{{ errore }}</div></div>
    {% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="f-new">Nuova Password</label>
        <input type="password" id="f-new" name="nuova_password" class="form-control" autocomplete="new-password" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="f-conf">Conferma Password</label>
        <input type="password" id="f-conf" name="conferma_password" class="form-control" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn-success">Salva nuova password</button>
    </form>
  </div>
</div>
{% endblock %}
