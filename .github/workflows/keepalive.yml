name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 6 */2 * *'    # ogni 2 giorni alle 06:00 UTC
  workflow_dispatch:          # avvio manuale dal tab Actions

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check DB URL shape
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_SERIEA }}
        run: |
          python3 - <<'EOF'
          import os, urllib.parse as u
          raw = os.environ["DB_URL"]
          print("len raw:", len(raw))
          print("whitespace ai bordi:", raw != raw.strip())
          print("apici ai bordi:", raw[:1] in "\"'" or raw[-1:] in "\"'")
          p = u.urlparse(raw.strip())
          print("scheme:", p.scheme)
          print("user:", p.username)
          print("host:", p.hostname, "port:", p.port, "db:", p.path)
          pw = p.password or ""
          print("password len:", len(pw))
          print("password ha % :", "%" in pw)
          EOF

      - name: Ping DB Serie A
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_SERIEA }}
        run: psql "$DB_URL" -c "select now();"
