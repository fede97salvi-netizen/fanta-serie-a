      - name: Diagnostica DB
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_SERIEA }}
        run: |
          psql "$DB_URL" -c "select current_database(), current_user, inet_server_addr();"
          psql "$DB_URL" -c "show search_path;"
          psql "$DB_URL" -c "select count(*) from public.utenti;"
          psql "$DB_URL" -c "select schemaname, tablename from pg_tables where tablename in ('utenti','stato_giornata');"
