name: Diagnostica DB
on:
  workflow_dispatch:

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - name: Query di controllo
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_SERIEA }}
        run: |
          psql "$DB_URL" -c "select current_user, session_user;"
          psql "$DB_URL" -c "show search_path;"
          psql "$DB_URL" -c "select count(*) from utenti;"
